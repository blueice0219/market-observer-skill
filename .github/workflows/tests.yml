name: Skill and application tests
on: [push, pull_request]
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "./skills/market-observer/assets/app[test]"
      - run: python -m pytest tests -q
      - run: python -m pytest -q
        working-directory: skills/market-observer/assets/app
      - run: python scripts/smoke_http.py
        working-directory: skills/market-observer/assets/app
